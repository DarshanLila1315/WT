<!-- Demonstrate the use of array to find maximum number. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        let n = prompt("Enter the number of elements in the array:");
        let arr = [];
        for (let i = 0; i < n; i++) {
            arr[i] = parseInt(prompt('Enter element :'));
        }
        let maxNumber = arr[0];
        for (let i = 1; i < arr.length; i++) {
            if (arr[i] > maxNumber) {
                maxNumber = arr[i];
            }
        }
        document.write("The maximum number in the array is: " + maxNumber);
    </script>
</body>

</html>
