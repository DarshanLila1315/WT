
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1,
        p {
            font-family: Arial, sans-serif;
            color: #1e1ead;
        }

        * {
            box-sizing: border-box;
        }

        div p {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>
    <h1>This is a heading</h1>
    <p>This is a paragraph.</p><br>
    <div>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Enim totam explicabo sunt consectetur! Accusantium aut ea delectus vitae quo dicta quia eaque omnis deleniti porro, optio eligendi cumque, odio molestias.</p>
    </div>


</body>

</html>
