using media queries to improve readability on all devices.  -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="10.3.css">
</head>

<body>
    <div class="container">
        <h1>Responsive Webpage</h1>
        <img src="extra/logo.png" alt="Logo" class="responsive-image">
    </div>
</body>

</html>
