<!-- Write a JavaScript that uses a loop that searches a word in sentence held in an array, returning the index of the word. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let sentence = prompt("Enter a sentence:");
        let wordToSearch = prompt("Enter the word to search for:");
        let wordsArray = sentence.split(" ");
        let index = -1;

        for (let i = 0; i < wordsArray.length; i++) {
            if (wordsArray[i] === wordToSearch) {
                index = i;
                break;
            }
        }

        if (index !== -1) {
            document.write('The word  is found at index: ' + index);
        } else {
            document.write('The word  is not found in the sentence.');
        }
    </script>
</body>

</html>
