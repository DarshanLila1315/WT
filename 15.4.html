<!-- Demonstrate different array functions like push, pop, shift, unshift, splice, sort etc -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let arr = [1, 2, 3, 4, 5];
        document.write("Original array: " + arr + "<br>");

        arr.push(6);
        document.write("After push(6): " + arr + "<br>");

        arr.pop();
        document.write("After pop(): " + arr + "<br>");

        arr.shift();
        document.write("After shift(): " + arr + "<br>");

        arr.unshift(0);
        document.write("After unshift(0): " + arr + "<br>");

        arr.splice(2, 1, 10);
        document.write("After splice(2, 1, 10): " + arr + "<br>");

        arr.sort();
        document.write("After sort(): " + arr + "<br>");
    </script>
</body>

</html>
