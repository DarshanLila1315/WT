<!-- WAP in JavaScript to check whether the given no. is prime or not. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 id="prime"></h1>
    <script>
        var num = parseInt(prompt("Enter a number:"));
        var isPrime = true;
        console.log("Checking if " + num + " is a prime number.");

        if (num <= 1) {
            isPrime = false;
        } else {
            for (var i = 2; i * i <= num; i++) {
                if (num % i === 0) {
                    isPrime = false;
                    break;
                }
            }
        }

        if (isPrime) {
            document.getElementById("prime").innerHTML = num + " is a prime number.";
        } else {
            document.getElementById("prime").innerHTML = num + " is not a prime number.";
        }
    </script>
</body>

</html>
