<!-- Create a webpage that applies different styles to elements using pseudo-classes such as 
:hover for buttons, :focus for form inputs, and :nth-child for styling specific list. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="11.1.css">
</head>

<body>
    <div class="container">
        <h1>Responsive Webpage</h1>
        <button class="btn">Hover Me</button>
        <input type="text" placeholder="Focus on me">
        <ul class="list">
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
            <li>Item 4</li>
            <li>Item 5</li>
        </ul>
    </div>
</body>

</html>
