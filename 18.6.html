<!-- Demonstrate the Array and Object Destructuring. -->

<!DOCTYPE html>
<html>

<body>
    <h2>Destructuring</h2>
    <p id="result"></p>

    <script>
        // Array destructuring
        let numbers = [10, 20, 30];
        let [a, b, c] = numbers;

        // Object destructuring
        let student = {
            name: "Darshan",
            age: 20,
            city: "Rajkot"
        };

        let {
            name,
            age,
            city
        } = student;

        document.getElementById("result").innerHTML =
            "Array values: " + a + ", " + b + ", " + c +
            "<br>Name: " + name +
            "<br>Age: " + age +
            "<br>City: " + city;
    </script>
</body>

</html>
