<!-- When a list item is clicked, change its background color to  yellow and slide  it up, then  fade it out using jQuery. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <script>
        $(document).ready(function() {
            $('li').click(function() {
                $(this).css('background-color', 'yellow').slideUp().fadeOut();
            });
        });
    </script>

</body>

</html>
