<!DOCTYPE html>
<html>

<body>
    <h2>Default Parameters</h2>
    <p id="result"></p>

    <script>
        function add(a, b = 10) {
            return a + b;
        }

        document.getElementById("result").innerHTML =
            "add(5) = " + add(5) +
            "<br>add(5, 20) = " + add(5, 20);
    </script>
</body>

</html>
