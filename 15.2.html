<!-- WAP to display students stored in array.  -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let students = {
            "John Doe": 20,
            "Jane Smith": 22,
            "Alice Johnson": 19,
            "Bob Brown": 21
        };
        document.write("List of Students:<br>");
        for (let student in students) {
            document.write(student + " - Age: " + students[student] + "<br>");
        }
    </script>
</body>

</html>
