<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mouse Events</title>
</head>

<body>
    <script>
        document.addEventListener("mousedown", function(event) {
            if (event.button === 0) {
                alert("Left Clicked");
            } else if (event.button === 2) {
                alert("Right Clicked");
            }
        });

        document.addEventListener("contextmenu", function(event) {
            event.preventDefault();
        });
    </script>
</body>

</html>
