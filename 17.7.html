<!-- WAP to perform CRUD operation on Array using HTML and JavaScript.  -->


<!DOCTYPE html>
<html>

<head>
    <title>CRUD Operations on Array</title>
</head>

<body>

    <h2>CRUD Operations on Array</h2>

    <input type="text" id="value" placeholder="Enter a value">
    <br><br>

    <input type="number" id="index" placeholder="Enter index">
    <br><br>

    <button onclick="create()">Create</button>
    <button onclick="read()">Read</button>
    <button onclick="update()">Update</button>
    <button onclick="remove()">Delete</button>

    <h3>Array Elements:</h3>
    <p id="result"></p>

    <script>
        let arr = [];


        function create() {
            let value = document.getElementById("value").value;

            if (value === "") {
                alert("Please enter a value");
                return;
            }

            arr.push(value);
            read();
            document.getElementById("value").value = "";
        }


        function read() {
            document.getElementById("result").innerHTML =
                arr.map((item, i) => i + ": " + item).join("<br>") ||
                "Array is empty";
        }


        function update() {
            let index = Number(document.getElementById("index").value);
            let value = document.getElementById("value").value;

            if (
                document.getElementById("index").value === "" ||
                index < 0 ||
                index >= arr.length ||
                !Number.isInteger(index)
            ) {
                alert("Please enter a valid index");
                return;
            }

            if (value === "") {
                alert("Please enter a new value");
                return;
            }

            arr[index] = value;
            read();
        }

        function remove() {
            let index = Number(document.getElementById("index").value);

            if (
                document.getElementById("index").value === "" ||
                index < 0 ||
                index >= arr.length ||
                !Number.isInteger(index)
            ) {
                alert("Please enter a valid index");
                return;
            }

            arr.splice(index, 1);
            read();
        }
    </script>

</body>

</html>
