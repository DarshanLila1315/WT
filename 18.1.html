<!-- WAP to demonstrate callbacks in JavaScript. -->

<!DOCTYPE html>
<html>

<body>
    <h2>Callback Function</h2>
    <p id="result"></p>

    <script>
        function display(name, callback) {
            document.getElementById("result").innerHTML =
                "Hello, " + name;
            callback();
        }

        function message() {
            document.getElementById("result").innerHTML +=
                "<br>Welcome to JavaScript!";
        }

        display("Darshan", message);
    </script>
</body>

</html>
