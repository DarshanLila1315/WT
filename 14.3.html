<!-- WAP to read an array from the user and sort them using bubble sort. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let n = prompt("Enter the number of elements in the array:");
        let arr = [];
        for (let i = 0; i < n; i++) {
            arr[i] = parseInt(prompt('Enter element :'));
        }
        for (let i = 0; i < n - 1; i++) {
            for (let j = 0; j < n - i - 1; j++) {
                if (arr[j] > arr[j + 1]) {
                    let temp = arr[j];
                    arr[j] = arr[j + 1];
                    arr[j + 1] = temp;
                }
            }
        }
        document.write("The sorted array in ascending order is: " + arr);
    </script>
</body>

</html>
