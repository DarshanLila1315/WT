<!-- AP in JavaScript to check whether the given number is palindrome or not. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 id="palindrome"></h1>
    <script>
        var num = parseInt(prompt("Enter a number:"));
        var originalNum = num;
        var reversedNum = 0;

        while (num > 0) {
            var digit = num % 10;
            reversedNum = (reversedNum * 10) + digit;
            num = Math.floor(num / 10);
        }

        if (originalNum === reversedNum) {
            document.getElementById("palindrome").innerHTML = originalNum + " is a palindrome number.";
        } else {
            document.getElementById("palindrome").innerHTML = originalNum + " is not a palindrome number.";
        }
    </script>
</body>

</html>
