<!-- WAP to display Faculties stored in array. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        let faculties = ["Computer Science", "Mathematics", "Physics", "Chemistry", "Biology"];
        document.write("List of Faculties:<br>");
        for (let i = 0; i < faculties.length; i++) {
            document.write((i + 1) + ". " + faculties[i] + "<br>");
        }
    </script>
</body>

</html>
