<!-- WAP to read an array form the user and sort them using quick sort. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let n = prompt("Enter the number of elements in the array:");
        let arr = [];
        for (let i = 0; i < n; i++) {
            arr[i] = parseInt(prompt('Enter element :'));
        }

        function quickSort(arr) {
            if (arr.length <= 1) {
                return arr;
            }
            let pivot = arr[arr.length - 1];
            let left = [];
            let right = [];
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] < pivot) {
                    left.push(arr[i]);
                } else {
                    right.push(arr[i]);
                }
            }
            return quickSort(left).concat(pivot, quickSort(right));
        }

        let sortedArray = quickSort(arr);
        document.write("The sorted array in ascending order is: " + sortedArray);
    </script>
</body>

</html>
