<!-- Write a JavaScript to take 2-digit number and then separate these 2 digits, then 
multiply first digit by itself for second digit times. (For example, 23 should be separated 
as 2 and 3. 2 should multiply with itself 3 times) -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let number = prompt("Enter a 2-digit number:");
        if (number.length === 2 && !isNaN(number)) {
            let firstDigit = parseInt(number[0]);
            let secondDigit = parseInt(number[1]);
            let result = Math.pow(firstDigit, secondDigit);
            document.write(firstDigit + " raised to the power of " + secondDigit + " is: " + result);
        } else {
            document.write("Please enter a valid 2-digit number.");
        }
    </script>

</body>

</html>
